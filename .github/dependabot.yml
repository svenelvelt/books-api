version: 2

# Weekly, one grouped pull request per ecosystem. Docker images are left out:
# python:3.13-slim gets patch releases on rebuild, and the MongoDB version is
# pinned on purpose (see the comment in ci.yml).
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
