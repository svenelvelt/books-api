name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        # Not 8.0: 8.0.34 refuses to start on the runners' kernel
        # (https://jira.mongodb.org/browse/SERVER-121912).
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: >-
          uv run pytest --cov --cov-report=term
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t books-api .

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
      - name: Check formatting
        run: terraform fmt -check -recursive
      # No backend and no credentials: validate needs only the providers.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Runs once the AWS side exists (see terraform/README.md): set the repository
  # variables AWS_DEPLOY_ROLE_ARN and AWS_REGION to enable it. The names below
  # (books-api) match Terraform's default `name` variable.
  deploy:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Exchange GitHub's OIDC token for the deploy role.
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        # Tags are immutable, so a re-run for the same commit reuses its image.
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/books-api:${{ github.sha }}"
          if aws ecr describe-images --repository-name books-api \
              --image-ids imageTag=${{ github.sha }} > /dev/null 2>&1; then
            echo "Image for ${{ github.sha }} already exists; reusing it."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Fetch current task definition
        run: >-
          aws ecs describe-task-definition --task-definition books-api
          --query taskDefinition > task-definition.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ env.IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: books-api
          service: books-api
          wait-for-service-stability: true
